services:
  api:
    build: ./api
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Point the container at another index that the host has built.
      STORE_PATH: ${STORE_PATH:-data/store.db}
    volumes:
      # The index is built on the host. The container reads the same file.
      - ./data:/srv/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build: ./web
    environment:
      # The web app forwards /api/* to this address. The browser never calls the API directly.
      API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
