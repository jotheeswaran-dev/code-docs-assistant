[project]
name = "code-docs-assistant-api"
version = "0.1.0"
description = "Answers questions about a code repository, with a citation for each claim."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
