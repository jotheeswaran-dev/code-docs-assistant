[project]
name = "code-docs-assistant-api"
version = "0.1.0"
description = "Answers questions about a code repository, with a citation for each claim."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "pydantic-settings>=2.7",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.20",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# The fixtures hold broken code on purpose. The linter must not touch them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
